<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário HTML</title>
</head>
<body>
    <header>
        <h3>Formulario e Inputs</h3>
    </header>
    <main>
        <form id="registerForm" method="post">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required />
            <br>

            <label for="email">Endereço de e-mail</label>
            <input type="email" id="email" name="email" />
            <br>
            <label for="senha">Informe sua senha:</label>
            <input type="password" id="senha" name="senha" required />
            <br>

            <label for="mensagem">Inrfome sua mensagem: </label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento">Selecione o envento escolhido</label>
            <br>
            <select id="evento" name="evento">
                <option value="rock">Show de Rock</option>
                <option value="madao">Show de Sertanejo</option>
                <option value="teatro">Teatro: Comédia</option>

            </select>
            <br>
            <label for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
            </label>
            <br>
            <label><input type="radio" name="pagamento" value="pix"/>pix</label>
            <label><input type="radio" name="pagamento" value="cartão"/>cartão</label>
            <br>
           

            <input type="submit" value="Cadastrar"/>

        </form>
    </main>
    <footer>
        <P>Desenvolvido por Rafael</P>
    </footer>
    <script>
        document.getElementById('registerForm').addEventListener('submit',function (event)
        {
            event.preventDefault(); // Impede o comportamento padrão de envio do formulário (recarregamento)
            alert('cadastro enviado com sucesso');
        })
    </script>
    
</body>
</html>
